<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .card {
      background: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    p.subtitle {
      color: #6b7280;
      font-size: 0.875rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: 0.35rem;
    }

    input {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #1f2937;
      transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }

    input:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    button {
      width: 100%;
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease-in-out;
      margin-top: 0.5rem;
    }

    button:hover {
      background-color: #4338ca;
    }

    button:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      display: none;
    }

    .alert-success {
      background-color: #def7ec;
      color: #03543f;
      border: 1px solid #bcf0da;
    }

    .alert-error {
      background-color: #fde8e8;
      color: #9b1c1c;
      border: 1px solid #fbd5d5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Crear Cuenta</h1>
    <p class="subtitle">Ingresa tus datos para registrarte</p>

    <div id="alertMessage" class="alert"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="name">Nombre Completo</label>
        <input type="text" id="name" name="name" required placeholder="Ej. Juan Pérez">
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required minlength="8" placeholder="Mínimo 8 caracteres">
      </div>

      <button type="submit" id="submitBtn">Registrarse</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertMessage');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = 'alert ' + (type === 'success' ? 'alert-success' : 'alert-error');
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.textContent = '';
      alertBox.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!name || !email || !password) {
        showAlert('Todos los campos son obligatorios', 'error');
        return;
      }

      if (password.length < 8) {
        showAlert('La contraseña debe tener al menos 8 caracteres', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Registrando...';

      try {
        const response = await fetch('/users/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ name, email, password }),
        });

        const data = await response.json();

        if (response.ok) {
          showAlert('¡Usuario registrado con éxito!', 'success');
          form.reset();
        } else {
          const errorMessage = Array.isArray(data.message)
            ? data.message.join(', ')
            : (data.message || 'Error al registrar el usuario');
          showAlert(errorMessage, 'error');
        }
      } catch (err) {
        showAlert('No se pudo conectar con el servidor', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Registrarse';
      }
    });
  </script>
</body>
</html>
